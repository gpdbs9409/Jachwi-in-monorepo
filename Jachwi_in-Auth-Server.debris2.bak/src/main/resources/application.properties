server.port=8081
spring.profiles.active=local

# MySQL (Auth Server는 users 테이블만 사용)
spring.datasource.url=jdbc:mysql://localhost:3306/jachwiin_db?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis
redis.host=localhost
redis.port=6379

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT (Main Server와 반드시 동일한 시크릿 사용)
jwt.secret=${JWT_SECRET:jachwi-in-secret-key-must-be-at-least-32-characters}
